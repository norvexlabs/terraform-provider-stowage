# The release, in the layout the OpenTofu and Terraform registries read: a zip per platform
# (terraform-provider-stowage_<version>_<os>_<arch>.zip), <name>_<version>_SHA256SUMS over them and
# the manifest, its binary detached signature <name>_<version>_SHA256SUMS.sig by the release key
# (GPG_FINGERPRINT; its passphrase PASSPHRASE on gpg's standard input), and
# <name>_<version>_manifest.json (plugin protocol 6.0). The release is left a draft: the workflow
# verifies the signature with the key in keys/ and publishes it.
version: 2
project_name: terraform-provider-stowage
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -buildid= -X main.version={{ .Version }}"
    goos: [freebsd, windows, linux, darwin]
    goarch: [amd64, "386", arm, arm64]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  - artifacts: checksum
    stdin: "{{ .Env.PASSPHRASE }}"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  draft: true
  replace_existing_draft: true
  replace_existing_artifacts: true
  name_template: "terraform-provider-stowage {{ .Version }}"
changelog:
  disable: true
